name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Build with a pinned Xcode, not whichever one the runner image defaults
  # to; the image installs each Xcode as /Applications/Xcode_<version>.app.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging

  build:
    name: Build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('RDPeek.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Generate project
        run: xcodegen generate

      # Swift leaves some warnings as warnings despite warnings-as-errors,
      # such as Sendable checks that a @preconcurrency API downgrades, so
      # each step that compiles fails on any Swift warning in its log.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project RDPeek.xcodeproj \
            -scheme RDPeek \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath DerivedData/SourcePackages \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log
          if grep -E '\.swift:[0-9]+:[0-9]+: warning:' build.log; then
            echo "::error::The build has Swift warnings (listed above)."
            exit 1
          fi

      - name: Test
        run: |
          set -o pipefail
          xcodebuild \
            -project RDPeek.xcodeproj \
            -scheme RDPeek \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath DerivedData/SourcePackages \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee test.log
          if grep -E '\.swift:[0-9]+:[0-9]+: warning:' test.log; then
            echo "::error::The test build has Swift warnings (listed above)."
            exit 1
          fi
