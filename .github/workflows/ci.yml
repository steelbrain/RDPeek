name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request cancels its run in progress; a push to
  # main lets the run in progress finish, so that commit gets a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Build with a pinned Xcode, not whichever one the runner image defaults
  # to; the image installs each Xcode as /Applications/Xcode_<version>.app.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  HOMEBREW_NO_AUTO_UPDATE: 1
  # Homebrew installs its current SwiftLint and XcodeGen, not a pinned
  # release; each install warns when it differs from the versions the
  # gates are run with locally.
  SWIFTLINT_VERSION: 0.65.1
  XCODEGEN_VERSION: 2.46.0

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install SwiftLint
        run: |
          brew install swiftlint
          version=$(swiftlint version)
          echo "SwiftLint $version"
          if [ "$version" != "$SWIFTLINT_VERSION" ]; then
            echo "::warning::CI has SwiftLint $version, not $SWIFTLINT_VERSION."
          fi

      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging

  build:
    name: Build
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen and SwiftLint
        run: |
          brew install xcodegen swiftlint
          xcodegen_version=$(xcodegen --version | sed 's/^Version: //')
          swiftlint_version=$(swiftlint version)
          echo "XcodeGen $xcodegen_version, SwiftLint $swiftlint_version"
          if [ "$xcodegen_version" != "$XCODEGEN_VERSION" ]; then
            echo "::warning::CI has XcodeGen $xcodegen_version, not $XCODEGEN_VERSION."
          fi
          if [ "$swiftlint_version" != "$SWIFTLINT_VERSION" ]; then
            echo "::warning::CI has SwiftLint $swiftlint_version, not $SWIFTLINT_VERSION."
          fi

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('RDPeek.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Generate project
        run: xcodegen generate

      # Swift leaves some warnings as warnings despite warnings-as-errors,
      # such as Sendable checks that a @preconcurrency API downgrades, so
      # each step that compiles fails on any Swift warning in its log.
      - name: Build
        id: build
        run: |
          set -o pipefail
          xcodebuild \
            -project RDPeek.xcodeproj \
            -scheme RDPeek \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath DerivedData/SourcePackages \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log
          if grep -E '\.swift:[0-9]+:[0-9]+: warning:' build.log; then
            echo "::error::The build has Swift warnings (listed above)."
            exit 1
          fi

      - name: Test
        run: |
          set -o pipefail
          xcodebuild \
            -project RDPeek.xcodeproj \
            -scheme RDPeek \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath DerivedData/SourcePackages \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee test.log
          if grep -E '\.swift:[0-9]+:[0-9]+: warning:' test.log; then
            echo "::error::The test build has Swift warnings (listed above)."
            exit 1
          fi

      # The unused-code gate reads the compiler log of a clean app build.
      # build.log is one: DerivedData starts empty apart from the cached
      # package checkouts, and the scheme's build action builds only the
      # app. It runs whenever the build passed, even if a test failed.
      - name: Analyze
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: swiftlint analyze --strict --compiler-log-path build.log --reporter github-actions-logging
