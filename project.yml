name: RDPeek
options:
  bundleIdPrefix: ai.aneesiqbal
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    DEAD_CODE_STRIPPING: YES
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    CODE_SIGN_STYLE: Automatic
packages:
  RDPKit:
    url: https://github.com/steelbrain/RDPKit.git
    exactVersion: 0.5.0
targets:
  RDPeek:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          # The icon pipeline (master artwork and renderer) lives beside the
          # asset catalog but must not ship in the bundle — only the rendered
          # appiconset does.
          - Resources/AppIcon.svg
          - Resources/build-app-icon.sh
    dependencies:
      - package: RDPKit
        product: RDPKit
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: RDPeek
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: Copyright © 2026 Anees Iqbal.
        NSLocalNetworkUsageDescription: RDPeek connects to the remote desktops you add on your local network.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.aneesiqbal.rdpeek
        PRODUCT_NAME: RDPeek
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: "5"
        MARKETING_VERSION: "1.2.0"
    scheme:
      testTargets:
        - RDPeekTests
  RDPeekTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      # Unhosted test bundle: compiles the files under test directly so the
      # hardened-runtime app does not need to host the tests.
      - path: Tests
      - path: Sources/ConnectionCenter/DeviceGridNavigation.swift
      - path: Sources/ConnectionCenter/DeviceListModel.swift
      - path: Sources/Session/RemoteDisplaySelection.swift
      - path: Sources/Diagnostics/DiagnosticsView.swift
      - path: Sources/Session/FramePacing.swift
      - path: Sources/Session/FramePresentationClockView.swift
      - path: Sources/Session/KeyboardLayouts.swift
      - path: Sources/Session/RemoteDesktopCanvasView.swift
      - path: Sources/Session/RemoteDesktopRenderer.swift
      - path: Sources/Session/RemoteInputCaptureView.swift
      - path: Sources/Session/SessionClipboard.swift
      - path: Sources/Session/SessionCommandState.swift
      - path: Sources/Session/SessionHUD.swift
      - path: Sources/Session/SessionCredentialPolicy.swift
      - path: Sources/Session/SessionModels.swift
      - path: Sources/Session/SessionWindowPlacement.swift
      - path: Sources/Session/WindowsKeyboardLayoutTables.swift
      - path: Sources/Storage/DeviceProfileStore.swift
      - path: Sources/Storage/ClientLicenseStore.swift
      - path: Sources/Storage/InMemoryCredentialCache.swift
      - path: Sources/Storage/KeychainCredentialStore.swift
      - path: Sources/Storage/KeychainService.swift
      - path: Sources/Storage/TrustedCertificateStore.swift
    dependencies:
      - package: RDPKit
        product: RDPKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.aneesiqbal.rdpeek-tests
        GENERATE_INFOPLIST_FILE: YES
